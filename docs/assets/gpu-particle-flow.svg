<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"
     role="img" aria-label="GPU パーティクルの流れ。CPU は定数と 2 つの命令を出すだけで、位置と速度は構造化バッファの中に留まり続ける">
  <rect x="0" y="0" width="720" height="300" fill="#f6f8fa"/>

  <text x="24" y="34" font-family="Meiryo, sans-serif" font-size="17" fill="#1f2328">
    位置と速度は GPU から出ない
  </text>

  <!-- CPU 帯 -->
  <rect x="24" y="58" width="672" height="62" rx="6" fill="#eaeef2" stroke="#8c959f"
        stroke-width="1"/>
  <text x="40" y="82" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">CPU</text>
  <text x="40" y="104" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    渡すのは「前フレームからの秒」「湧き出し口」「何個」だけ。数が増えても仕事は変わらない。
  </text>

  <!-- GPU 帯 -->
  <rect x="24" y="146" width="672" height="128" rx="6" fill="#ddf4ff" stroke="#0a4f9e"
        stroke-width="1"/>
  <text x="40" y="170" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">GPU</text>

  <!-- コンピュート -->
  <rect x="60" y="184" width="180" height="66" rx="6" fill="#ffffff" stroke="#1f2328"
        stroke-width="1.5"/>
  <text x="150" y="210" font-family="Meiryo, sans-serif" font-size="13"
        fill="#1f2328" text-anchor="middle">Dispatch</text>
  <text x="150" y="232" font-family="Meiryo, sans-serif" font-size="12"
        fill="#3d444d" text-anchor="middle">寿命・速度・位置を更新</text>

  <!-- バッファ -->
  <rect x="284" y="184" width="152" height="66" rx="6" fill="#fff8c5" stroke="#1f2328"
        stroke-width="1.5"/>
  <text x="360" y="210" font-family="Meiryo, sans-serif" font-size="13"
        fill="#1f2328" text-anchor="middle">構造化バッファ</text>
  <text x="360" y="232" font-family="Meiryo, sans-serif" font-size="12"
        fill="#3d444d" text-anchor="middle">1 個 48 バイト</text>

  <!-- 描画 -->
  <rect x="480" y="184" width="180" height="66" rx="6" fill="#ffffff" stroke="#1f2328"
        stroke-width="1.5"/>
  <text x="570" y="210" font-family="Meiryo, sans-serif" font-size="13"
        fill="#1f2328" text-anchor="middle">DrawInstanced</text>
  <text x="570" y="232" font-family="Meiryo, sans-serif" font-size="12"
        fill="#3d444d" text-anchor="middle">頂点シェーダーが読む</text>

  <!-- 矢印 -->
  <g stroke="#0a4f9e" stroke-width="2" fill="#0a4f9e">
    <line x1="240" y1="207" x2="276" y2="207"/>
    <path d="M284 207 l-9 -5 l0 10 Z"/>
    <line x1="436" y1="207" x2="472" y2="207"/>
    <path d="M480 207 l-9 -5 l0 10 Z"/>
  </g>

  <!-- CPU からの矢印 -->
  <g stroke="#8c959f" stroke-width="1.5" fill="#8c959f" stroke-dasharray="4 4">
    <line x1="150" y1="120" x2="150" y2="178"/>
    <line x1="570" y1="120" x2="570" y2="178"/>
  </g>
  <g stroke="none" fill="#8c959f">
    <path d="M150 184 l-5 -9 l10 0 Z"/>
    <path d="M570 184 l-5 -9 l10 0 Z"/>
  </g>
</svg>
