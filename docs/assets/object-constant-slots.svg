<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="定数バッファのスロット配置。オブジェクト別定数はフレーム数かけるオブジェクト数ぶん必要で、フレーム共通定数はフレーム数ぶんでよいことを示す図">
  <style>
    .bg   { fill: #f6f8fa; }
    .txt  { font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .ttl  { font-size: 16px; font-weight: 600; }
    .cap  { font-size: 13px; font-weight: 600; }
    .sub  { font-size: 12px; fill: #3d444d; }
    .num  { font-size: 11px; fill: #3d444d; }
    .f0   { fill: #ddf4ff; stroke: #0a4f9e; stroke-width: 1.6; }
    .f1   { fill: #dafbe1; stroke: #0d4f21; stroke-width: 1.6; }
  </style>

  <rect class="bg" width="760" height="440" rx="8"/>
  <text class="txt ttl" x="20" y="30">定数バッファのスロット — なぜ「フレーム数 × オブジェクト数」要るのか</text>
  <text class="txt sub" x="20" y="52">バックバッファ 2 枚・オブジェクト 2 個の場合。1 スロットは 256 バイト境界に揃える。</text>

  <!-- オブジェクト別 -->
  <text class="txt cap" x="20" y="90">オブジェクト別</text>
  <text class="txt sub" x="20" y="108">（変換行列）</text>

  <text class="num" text-anchor="middle" x="180" y="86">0</text>
  <text class="num" text-anchor="middle" x="315" y="86">256</text>
  <text class="num" text-anchor="middle" x="450" y="86">512</text>
  <text class="num" text-anchor="middle" x="585" y="86">768</text>
  <text class="num" text-anchor="middle" x="720" y="86">1024</text>

  <rect class="f0" x="180" y="94" width="135" height="46" rx="3"/>
  <rect class="f0" x="315" y="94" width="135" height="46" rx="3"/>
  <rect class="f1" x="450" y="94" width="135" height="46" rx="3"/>
  <rect class="f1" x="585" y="94" width="135" height="46" rx="3"/>

  <text class="txt sub" text-anchor="middle" x="247" y="113">フレーム 0</text>
  <text class="txt sub" text-anchor="middle" x="247" y="131">床</text>
  <text class="txt sub" text-anchor="middle" x="382" y="113">フレーム 0</text>
  <text class="txt sub" text-anchor="middle" x="382" y="131">立方体</text>
  <text class="txt sub" text-anchor="middle" x="517" y="113">フレーム 1</text>
  <text class="txt sub" text-anchor="middle" x="517" y="131">床</text>
  <text class="txt sub" text-anchor="middle" x="652" y="113">フレーム 1</text>
  <text class="txt sub" text-anchor="middle" x="652" y="131">立方体</text>

  <!-- フレーム共通 -->
  <text class="txt cap" x="20" y="180">フレーム共通</text>
  <text class="txt sub" x="20" y="198">（カメラ・ライト）</text>

  <rect class="f0" x="180" y="166" width="135" height="46" rx="3"/>
  <rect class="f1" x="315" y="166" width="135" height="46" rx="3"/>

  <text class="txt sub" text-anchor="middle" x="247" y="194">フレーム 0</text>
  <text class="txt sub" text-anchor="middle" x="382" y="194">フレーム 1</text>

  <text class="txt sub" x="470" y="186">全オブジェクトで同じ値なので、</text>
  <text class="txt sub" x="470" y="206">1 フレームに 1 組あれば足りる。</text>

  <!-- 理由 1 -->
  <rect x="20" y="240" width="720" height="82" rx="6" fill="#ddf4ff" stroke="#0a4f9e" stroke-width="1.5"/>
  <text class="txt cap" x="36" y="264">フレームで分ける理由 : GPU はまだ前のフレームを描いている</text>
  <text class="txt sub" x="36" y="288">CPU が次のフレームの準備をしている最中、GPU は前のフレームをまだ描いている。</text>
  <text class="txt sub" x="36" y="308">同じ場所へ書くと、描画中に値が変わって絵が崩れる。</text>

  <!-- 理由 2 -->
  <rect x="20" y="334" width="720" height="92" rx="6" fill="#dafbe1" stroke="#0d4f21" stroke-width="1.5"/>
  <text class="txt cap" x="36" y="358">オブジェクトで分ける理由 : コマンドは記録するだけで、実行は後</text>
  <text class="txt sub" x="36" y="382">コマンドリストに記録されるのは「値」ではなく「どのアドレスを読むか」。</text>
  <text class="txt sub" x="36" y="402">全員が同じ場所を指していると、GPU が実行する頃には「最後に書いた 1 つ」を</text>
  <text class="txt sub" x="36" y="420">全員がそろって読む。エラーは出ず、姿勢だけがおかしくなる。</text>
</svg>
