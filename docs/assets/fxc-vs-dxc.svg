<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
     role="img" aria-label="FXC と DXC の比較。起動時間は 4061 ミリ秒から 1369 ミリ秒へ、コンパイル時間は 3.48 秒から 1.52 秒へ、バイトコードは 486 キロバイトから 302 キロバイトへ減った">
  <rect x="0" y="0" width="720" height="400" fill="#f6f8fa"/>

  <text x="24" y="34" font-family="Meiryo, sans-serif" font-size="17" fill="#1f2328">
    FXC から DXC へ移した結果
  </text>

  <text x="24" y="72" font-family="Meiryo, sans-serif" font-size="14" fill="#1f2328">起動から描画開始まで（アプリ全体、中央値 5 回）</text>
  <rect x="152.0" y="86.0" width="367.4" height="26" rx="3" fill="#ffd8b5" stroke="#1f2328" stroke-width="1"/>
  <text x="527.4" y="104.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">4061 ms</text>
  <text x="142.0" y="104.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">FXC (SM 5.0)</text>
  <rect x="152.0" y="126.0" width="123.9" height="26" rx="3" fill="#ddf4ff" stroke="#1f2328" stroke-width="1"/>
  <text x="283.9" y="144.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">1369 ms</text>
  <text x="142.0" y="144.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">DXC (SM 6.0)</text>
  <text x="24" y="196" font-family="Meiryo, sans-serif" font-size="14" fill="#1f2328">49 通りのコンパイル時間（コマンドラインから、中央値 3 回）</text>
  <rect x="152.0" y="210.0" width="330.6" height="26" rx="3" fill="#ffd8b5" stroke="#1f2328" stroke-width="1"/>
  <text x="490.6" y="228.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">3.48 秒</text>
  <text x="142.0" y="228.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">FXC (SM 5.0)</text>
  <rect x="152.0" y="250.0" width="144.4" height="26" rx="3" fill="#ddf4ff" stroke="#1f2328" stroke-width="1"/>
  <text x="304.4" y="268.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">1.52 秒</text>
  <text x="142.0" y="268.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">DXC (SM 6.0)</text>
  <text x="24" y="320" font-family="Meiryo, sans-serif" font-size="14" fill="#1f2328">出来上がったバイトコードの合計</text>
  <rect x="152.0" y="334.0" width="355.3" height="26" rx="3" fill="#ffd8b5" stroke="#1f2328" stroke-width="1"/>
  <text x="515.3" y="352.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">486.2 KB</text>
  <text x="142.0" y="352.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">FXC (SM 5.0)</text>
  <rect x="152.0" y="374.0" width="220.3" height="26" rx="3" fill="#ddf4ff" stroke="#1f2328" stroke-width="1"/>
  <text x="380.3" y="392.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">301.5 KB</text>
  <text x="142.0" y="392.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">DXC (SM 6.0)</text>
</svg>
