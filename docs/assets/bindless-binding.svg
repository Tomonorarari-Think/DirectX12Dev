<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380"
     role="img" aria-label="ディスクリプタテーブルを描くたびに結び直す方法と、番号を定数で渡してシェーダーがヒープを直接引くビンドレスの比較">
  <rect x="0" y="0" width="720" height="380" fill="#f6f8fa"/>

  <text x="24" y="34" font-family="Meiryo, sans-serif" font-size="17" fill="#1f2328">
    材質のテクスチャをどう渡すか
  </text>

  <!-- 上 : テーブル -->
  <text x="24" y="70" font-family="Meiryo, sans-serif" font-size="14" fill="#1f2328">
    テーブルを結び直す（これまで）
  </text>

  <g font-family="Meiryo, sans-serif" font-size="12" fill="#1f2328">
    <rect x="24" y="84" width="120" height="30" rx="4" fill="#eaeef2" stroke="#1f2328" stroke-width="1"/>
    <text x="84" y="104" text-anchor="middle">材質を描く直前</text>

    <rect x="176" y="84" width="150" height="30" rx="4" fill="#ffd8b5" stroke="#1f2328" stroke-width="1"/>
    <text x="251" y="104" text-anchor="middle">CBV を結ぶ</text>

    <rect x="338" y="84" width="150" height="30" rx="4" fill="#ffd8b5" stroke="#1f2328" stroke-width="1"/>
    <text x="413" y="104" text-anchor="middle">テーブル × 3</text>

    <rect x="500" y="84" width="120" height="30" rx="4" fill="#eaeef2" stroke="#1f2328" stroke-width="1"/>
    <text x="560" y="104" text-anchor="middle">DrawIndexed</text>
  </g>

  <g stroke="#8c959f" stroke-width="1.5" fill="#8c959f">
    <line x1="144" y1="99" x2="170" y2="99"/><path d="M176 99 l-7 -4 l0 8 Z"/>
    <line x1="326" y1="99" x2="332" y2="99"/><path d="M338 99 l-7 -4 l0 8 Z"/>
    <line x1="488" y1="99" x2="494" y2="99"/><path d="M500 99 l-7 -4 l0 8 Z"/>
  </g>

  <text x="176" y="136" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    サブメッシュ 1 つにつき、ルートへの設定が 4 回。
  </text>

  <!-- 下 : ビンドレス -->
  <text x="24" y="188" font-family="Meiryo, sans-serif" font-size="14" fill="#1f2328">
    番号を渡す（ビンドレス）
  </text>

  <g font-family="Meiryo, sans-serif" font-size="12" fill="#1f2328">
    <rect x="24" y="202" width="120" height="30" rx="4" fill="#eaeef2" stroke="#1f2328" stroke-width="1"/>
    <text x="84" y="222" text-anchor="middle">材質を描く直前</text>

    <rect x="176" y="202" width="150" height="30" rx="4" fill="#ddf4ff" stroke="#0a4f9e" stroke-width="1"/>
    <text x="251" y="222" text-anchor="middle">CBV を結ぶ</text>

    <rect x="500" y="202" width="120" height="30" rx="4" fill="#eaeef2" stroke="#1f2328" stroke-width="1"/>
    <text x="560" y="222" text-anchor="middle">DrawIndexed</text>
  </g>

  <g stroke="#8c959f" stroke-width="1.5" fill="#8c959f">
    <line x1="144" y1="217" x2="170" y2="217"/><path d="M176 217 l-7 -4 l0 8 Z"/>
    <line x1="326" y1="217" x2="494" y2="217"/><path d="M500 217 l-7 -4 l0 8 Z"/>
  </g>

  <text x="176" y="254" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    ルートへの設定は 1 回だけ。テクスチャの「番号」は定数の中にある。
  </text>

  <!-- ヒープ -->
  <rect x="176" y="276" width="444" height="66" rx="6" fill="#fff8c5" stroke="#1f2328"
        stroke-width="1"/>
  <text x="192" y="298" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">
    シェーダー可視ヒープ
  </text>
  <text x="192" y="322" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    ResourceDescriptorHeap[番号] — ルートに登録しなくても直接引ける（SM 6.6）
  </text>

  <g stroke="#0a4f9e" stroke-width="1.5" fill="#0a4f9e">
    <line x1="251" y1="232" x2="251" y2="270"/><path d="M251 276 l-5 -8 l10 0 Z"/>
  </g>
</svg>
