<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320"
     role="img" aria-label="カメラから見た板と床の位置関係。板が床に近づくほど不透明度を下げると、交差する線が消える">
  <rect x="0" y="0" width="720" height="320" fill="#f6f8fa"/>

  <text x="24" y="34" font-family="Meiryo, sans-serif" font-size="17" fill="#1f2328">
    深度の差で薄める
  </text>

  <!-- カメラ -->
  <g stroke="#1f2328" stroke-width="1.5" fill="#eaeef2">
    <path d="M44 150 L44 190 L74 205 L74 135 Z"/>
  </g>
  <text x="38" y="228" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">カメラ</text>

  <!-- 視線 -->
  <g stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4">
    <line x1="76" y1="170" x2="660" y2="170"/>
  </g>

  <!-- 床（不透明な物） -->
  <g>
    <path d="M470 96 L560 96 L560 250 L470 250 Z" fill="#d1d9e0" stroke="#1f2328"
          stroke-width="1.5"/>
    <text x="515" y="272" font-family="Meiryo, sans-serif" font-size="13"
          fill="#1f2328" text-anchor="middle">床</text>
  </g>

  <!-- 板（半透明） -->
  <g>
    <path d="M300 104 L300 242 L520 242 L520 104 Z" fill="#ddf4ff" stroke="#0a4f9e"
          stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="360" y="126" font-family="Meiryo, sans-serif" font-size="13"
          fill="#1f2328">板（半透明）</text>
  </g>

  <!-- 交差 -->
  <line x1="470" y1="104" x2="470" y2="242" stroke="#bc4c00" stroke-width="2.5"/>
  <text x="466" y="298" font-family="Meiryo, sans-serif" font-size="13"
        fill="#1f2328" text-anchor="middle">ここで切れる</text>

  <!-- 距離の矢印 -->
  <g stroke="#0a4f9e" stroke-width="1.5">
    <line x1="300" y1="170" x2="466" y2="170"/>
    <path d="M466 170 l-8 -4 l0 8 Z" fill="#0a4f9e"/>
  </g>
  <text x="316" y="162" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">
    奥にある物までの距離
  </text>

  <!-- 不透明度の帯 -->
  <g>
    <rect x="300" y="252" width="170" height="14" fill="#0a4f9e" fill-opacity="0.16"
          stroke="#8c959f" stroke-width="1"/>
    <text x="300" y="284" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
      不透明度 1
    </text>
    <text x="470" y="284" font-family="Meiryo, sans-serif" font-size="12"
          fill="#3d444d" text-anchor="end">0</text>
  </g>

  <text x="580" y="150" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">
    距離 ÷ 幅
  </text>
  <text x="580" y="172" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">
    を掛ける
  </text>
</svg>
