<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388"
     role="img" aria-label="GPU 時間のパス別内訳。全体 0.1185 ミリ秒のうち、シーンと後処理がそれぞれ約 4 分の 1 を占める">
  <rect x="0" y="0" width="720" height="388" fill="#f6f8fa"/>

  <text x="24" y="34" font-family="Meiryo, sans-serif" font-size="17" fill="#1f2328">
    GPU 時間の内訳（粒子 1024 個、Release、1280 x 720）
  </text>
  <text x="24" y="56" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    全体 0.1185 ms。同じフレームの CPU 側は 4.17 ms（垂直同期 240 Hz）だった。
  </text>

  <rect x="132.0" y="74.0" width="61.3" height="26.0" rx="3" fill="#ffd8b5" stroke="#1f2328" stroke-width="1"/>
  <rect x="132.0" y="108.0" width="291.3" height="26.0" rx="3" fill="#d8f0ff" stroke="#1f2328" stroke-width="1"/>
  <rect x="132.0" y="142.0" width="444.7" height="26.0" rx="3" fill="#c8e6ff" stroke="#1f2328" stroke-width="1"/>
  <rect x="132.0" y="176.0" width="145.7" height="26.0" rx="3" fill="#e2e4e8" stroke="#1f2328" stroke-width="1"/>
  <rect x="132.0" y="210.0" width="253.0" height="26.0" rx="3" fill="#ffe9a8" stroke="#1f2328" stroke-width="1"/>
  <rect x="132.0" y="244.0" width="444.7" height="26.0" rx="3" fill="#dafbe1" stroke="#1f2328" stroke-width="1"/>
  <rect x="132.0" y="278.0" width="176.3" height="26.0" rx="3" fill="#f0f0f0" stroke="#1f2328" stroke-width="1"/>

  <text x="122.0" y="92.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">粒子更新</text>
  <text x="203.3" y="92.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">0.0040 ms（3 %）</text>
  <text x="122.0" y="126.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">影</text>
