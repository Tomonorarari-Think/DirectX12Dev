  <text x="122.0" y="160.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">シーン</text>
  <text x="586.7" y="160.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">0.0290 ms（24 %）</text>
  <text x="122.0" y="194.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">背景</text>
  <text x="287.7" y="194.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">0.0095 ms（8 %）</text>
  <text x="122.0" y="228.0" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328" text-anchor="end">半透明</text>
  <text x="395.0" y="228.0" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">0.0165 ms（14 %）</text>
