<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="後処理のパスの流れ。シーンを HDR の中間バッファへ描き、明るい所を抽出して半分の解像度へ縮小し、横と縦に分けてぼかし、最後にシーンと合成して画面へ出す">
  <style>
    .bg   { fill: #f6f8fa; }
    .txt  { font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .ttl  { font-size: 16px; font-weight: 600; }
    .cap  { font-size: 13px; font-weight: 600; }
    .sub  { font-size: 12px; fill: #3d444d; }
    .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; fill: #1f2328; }
    .hdr  { fill: #ddf4ff; stroke: #0a4f9e; stroke-width: 1.8; }
    .half { fill: #fff8c5; stroke: #8a6d00; stroke-width: 1.8; }
    .out  { fill: #dafbe1; stroke: #0d4f21; stroke-width: 1.8; }
    .pass { fill: #eaeef2; stroke: #6e7781; stroke-width: 1.4; }
    .flow { stroke: #3d444d; stroke-width: 1.8; fill: none; }
    .side { stroke: #8a6d00; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect class="bg" width="880" height="470" rx="8"/>
  <text class="txt ttl" x="20" y="30">後処理のパス — 画面へ出す前に、もう一度読んで加工する</text>
  <text class="txt sub" x="20" y="50">中間バッファは HDR（16 bit 浮動小数点）。1.0 を超える明るさを残したまま次のパスへ渡す。</text>

  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d444d"/>
    </marker>
    <marker id="ps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d00"/>
    </marker>
  </defs>

  <!-- 上段 : シーン → 合成 → 画面 -->
  <rect class="hdr" x="20" y="86" width="150" height="62" rx="6"/>
  <text class="txt cap"  x="34" y="110">シーン（HDR）</text>
  <text class="txt mono" x="34" y="130">1280 x 720</text>
  <text class="txt mono" x="34" y="144">R16G16B16A16</text>

  <line class="flow" x1="170" y1="117" x2="588" y2="117" marker-end="url(#pf)"/>
  <text class="txt sub" x="300" y="106">そのまま合成へ</text>

  <rect class="pass" x="592" y="86" width="140" height="62" rx="6"/>
  <text class="txt cap"  x="606" y="108">合成</text>
  <text class="txt sub"  x="606" y="126">露出 → 圧縮</text>
  <text class="txt sub"  x="606" y="142">→ 周辺減光</text>

  <line class="flow" x1="732" y1="117" x2="768" y2="117" marker-end="url(#pf)"/>

  <rect class="out" x="772" y="86" width="88" height="62" rx="6"/>
  <text class="txt cap"  x="784" y="110">画面</text>
  <text class="txt mono" x="784" y="130">sRGB</text>
  <text class="txt mono" x="784" y="144">8 bit</text>

  <!-- 下段 : ブルームの 3 パス -->
  <line class="side" x1="95" y1="148" x2="95" y2="196" marker-end="url(#ps)"/>
  <text class="txt sub" x="104" y="176">明るい所だけ</text>

  <text class="txt cap" x="20" y="222">ブルーム（にじみ）— 半分の解像度で処理する</text>

  <rect class="half" x="20" y="238" width="150" height="72" rx="6"/>
  <text class="txt cap"  x="34" y="262">① しきい値抽出</text>
  <text class="txt sub"  x="34" y="282">1.0 を超えた所</text>
  <text class="txt mono" x="34" y="300">640 x 360 へ縮小</text>

  <line class="flow" x1="170" y1="274" x2="216" y2="274" marker-end="url(#pf)"/>

  <rect class="half" x="220" y="238" width="150" height="72" rx="6"/>
  <text class="txt cap"  x="234" y="262">② 横にぼかす</text>
  <text class="txt sub"  x="234" y="282">5 タップ × 2 方向</text>
  <text class="txt mono" x="234" y="300">A → B</text>

  <line class="flow" x1="370" y1="274" x2="416" y2="274" marker-end="url(#pf)"/>

  <rect class="half" x="420" y="238" width="150" height="72" rx="6"/>
  <text class="txt cap"  x="434" y="262">③ 縦にぼかす</text>
  <text class="txt sub"  x="434" y="282">同じ重みを使い回す</text>
  <text class="txt mono" x="434" y="300">B → A</text>

  <path class="side" d="M 570 274 L 640 274 L 640 152" marker-end="url(#ps)"/>
  <text class="txt sub" x="584" y="264">足し込む</text>

  <!-- 注釈 -->
  <text class="txt sub" x="20" y="356">・2 次元のぼかしを 1 次元 2 回で済ませられるのは、ガウス関数が縦横に分解できるため。9x9 なら 81 回が 18 回になる。</text>
  <text class="txt sub" x="20" y="378">・半分の解像度にすると読む量が 1/4 になり、同じ半径でも 2 倍ぼける。ぼかす前提なので細かさは要らない。</text>
  <text class="txt sub" x="20" y="400">・ブルームは「圧縮の前」に足す。あとで足すと、圧縮済みの絵に明るさを乗せることになり白飛びしやすい。</text>
  <text class="txt sub" x="20" y="422">・物体を描くシェーダーからは圧縮（トーンマッピング）を外した。同じ式が 2 か所にあると、片方だけ直して食い違う。</text>
  <text class="txt sub" x="20" y="444">・中間バッファは 8 bit にしてはいけない。書いた時点で 1.0 を超えた明るさが切り落とされ、ブルームが出なくなる。</text>
</svg>
