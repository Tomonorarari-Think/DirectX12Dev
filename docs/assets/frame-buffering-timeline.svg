<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="フレームバッファリング導入前後の CPU と GPU のタイムライン比較">
  <style>
    .bg   { fill: #f6f8fa; }
    .txt  { font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #24292f; }
    .ttl  { font-size: 16px; font-weight: 600; }
    .sec  { font-size: 14px; font-weight: 600; }
    .lbl  { font-size: 13px; }
    .sub  { font-size: 12px; fill: #57606a; }
    .cpu  { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .gpu  { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.6; }
    .idle { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .axis { stroke: #8c959f; stroke-width: 1.2; }
  </style>

  <rect class="bg" width="760" height="400" rx="8"/>
  <text class="txt ttl" x="20" y="30">CPU と GPU の動き — フレームバッファリングの効果</text>

  <!-- 改善前 -->
  <text class="txt sec" x="20" y="66">改善前：毎フレーム GPU の完了を待つ</text>
  <text class="txt lbl" x="20" y="100">CPU</text>
  <text class="txt lbl" x="20" y="134">GPU</text>
  <line class="axis" x1="60" y1="150" x2="740" y2="150"/>

  <rect class="cpu"  x="60"  y="84"  width="90" height="26" rx="3"/>
  <rect class="idle" x="150" y="84"  width="130" height="26" rx="3"/>
  <rect class="cpu"  x="280" y="84"  width="90" height="26" rx="3"/>
  <rect class="idle" x="370" y="84"  width="130" height="26" rx="3"/>
  <rect class="cpu"  x="500" y="84"  width="90" height="26" rx="3"/>
  <rect class="idle" x="590" y="84"  width="130" height="26" rx="3"/>
  <text class="txt sub" text-anchor="middle" x="105" y="102">記録0</text>
  <text class="txt sub" text-anchor="middle" x="215" y="102" fill="#cf222e">待機（無駄）</text>
  <text class="txt sub" text-anchor="middle" x="325" y="102">記録1</text>
  <text class="txt sub" text-anchor="middle" x="435" y="102" fill="#cf222e">待機（無駄）</text>
  <text class="txt sub" text-anchor="middle" x="545" y="102">記録2</text>
  <text class="txt sub" text-anchor="middle" x="655" y="102" fill="#cf222e">待機（無駄）</text>

  <rect class="gpu" x="150" y="118" width="130" height="26" rx="3"/>
  <rect class="gpu" x="370" y="118" width="130" height="26" rx="3"/>
  <rect class="gpu" x="590" y="118" width="130" height="26" rx="3"/>
  <text class="txt sub" text-anchor="middle" x="215" y="136">実行0</text>
  <text class="txt sub" text-anchor="middle" x="435" y="136">実行1</text>
  <text class="txt sub" text-anchor="middle" x="655" y="136">実行2</text>

  <text class="txt sub" x="60" y="172">交互にしか動けない。3 フレームに 660px 相当の時間がかかる。</text>

  <!-- 改善後 -->
  <text class="txt sec" x="20" y="222">改善後：アロケータをバックバッファ枚数ぶん用意し、必要な分だけ待つ</text>
  <text class="txt lbl" x="20" y="256">CPU</text>
  <text class="txt lbl" x="20" y="290">GPU</text>
  <line class="axis" x1="60" y1="306" x2="740" y2="306"/>

  <rect class="cpu" x="60"  y="240" width="90" height="26" rx="3"/>
  <rect class="cpu" x="150" y="240" width="90" height="26" rx="3"/>
  <rect class="cpu" x="240" y="240" width="90" height="26" rx="3"/>
  <rect class="cpu" x="330" y="240" width="90" height="26" rx="3"/>
  <text class="txt sub" text-anchor="middle" x="105" y="258">記録0</text>
  <text class="txt sub" text-anchor="middle" x="195" y="258">記録1</text>
  <text class="txt sub" text-anchor="middle" x="285" y="258">記録2</text>
  <text class="txt sub" text-anchor="middle" x="375" y="258">記録3</text>

  <rect class="gpu" x="150" y="274" width="130" height="26" rx="3"/>
  <rect class="gpu" x="280" y="274" width="130" height="26" rx="3"/>
  <rect class="gpu" x="410" y="274" width="130" height="26" rx="3"/>
  <text class="txt sub" text-anchor="middle" x="215" y="292">実行0</text>
  <text class="txt sub" text-anchor="middle" x="345" y="292">実行1</text>
  <text class="txt sub" text-anchor="middle" x="475" y="292">実行2</text>

  <text class="txt sub" x="60" y="328">CPU が 1 フレーム先行できる。GPU の実行が詰まって並ぶ。</text>

  <rect x="20" y="346" width="720" height="40" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text class="txt sub" x="36" y="371">ただし GPU の仕事が軽いうちは「待機」自体がほぼ 0 のため、この改善で速くはならない（実測結果は本文参照）。</text>
</svg>
