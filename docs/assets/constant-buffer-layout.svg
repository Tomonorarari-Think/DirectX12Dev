<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="定数バッファのフレーム別レイアウト図">
  <style>
    .bg   { fill: #f6f8fa; }
    .txt  { font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #24292f; }
    .ttl  { font-size: 16px; font-weight: 600; }
    .lbl  { font-size: 14px; }
    .sub  { font-size: 12px; fill: #57606a; }
    .slot { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .used { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
    .pad  { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.4; stroke-dasharray: 4 3; }
  </style>

  <rect class="bg" width="720" height="300" rx="8"/>
  <text class="txt ttl" x="20" y="30">定数バッファ（1 本のリソースに frameCount 個ぶんを並べる）</text>

  <!-- スロット 0 -->
  <rect class="slot" x="40" y="60" width="300" height="80" rx="4"/>
  <rect class="used" x="48" y="70" width="76" height="60" rx="3"/>
  <rect class="pad"  x="128" y="70" width="204" height="60" rx="3"/>
  <text class="txt lbl" text-anchor="middle" x="86" y="96">行列</text>
  <text class="txt sub" text-anchor="middle" x="86" y="116">64 B</text>
  <text class="txt sub" text-anchor="middle" x="230" y="104">パディング（192 B）</text>

  <!-- スロット 1 -->
  <rect class="slot" x="340" y="60" width="300" height="80" rx="4"/>
  <rect class="used" x="348" y="70" width="76" height="60" rx="3"/>
  <rect class="pad"  x="428" y="70" width="204" height="60" rx="3"/>
  <text class="txt lbl" text-anchor="middle" x="386" y="96">行列</text>
  <text class="txt sub" text-anchor="middle" x="386" y="116">64 B</text>
  <text class="txt sub" text-anchor="middle" x="530" y="104">パディング（192 B）</text>

  <text class="txt lbl" text-anchor="middle" x="190" y="52">フレーム 0 用（256 B）</text>
  <text class="txt lbl" text-anchor="middle" x="490" y="52">フレーム 1 用（256 B）</text>

  <text class="txt sub" x="40" y="162">↑ GpuAddress(0)</text>
  <text class="txt sub" x="340" y="162">↑ GpuAddress(1)</text>

  <rect x="40" y="182" width="600" height="42" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text class="txt sub" x="56" y="200">なぜ 256 B か：DirectX 12 は定数バッファの先頭アドレスが 256 バイト境界にあることを要求する。</text>
  <text class="txt sub" x="56" y="217">64 バイトの行列 1 個しか入れなくても、1 スロットは 256 バイトを消費する。</text>

  <rect x="40" y="236" width="600" height="42" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text class="txt sub" x="56" y="254">なぜフレームごとに分けるか：CPU がフレーム 1 用に書き込む時点で、GPU はまだフレーム 0 用を読んでいる。</text>
  <text class="txt sub" x="56" y="271">1 個を使い回すと描画途中で値が変わり、絵が壊れる（コマンドアロケータと同じ理屈）。</text>
</svg>
