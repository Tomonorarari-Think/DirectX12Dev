<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="ディスクリプタヒープとバックバッファの対応図">
  <style>
    .bg    { fill: #f6f8fa; }
    .txt   { font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .ttl   { font-size: 16px; font-weight: 600; }
    .cap   { font-size: 13px; font-weight: 600; }
    .lbl   { font-size: 14px; }
    .sub   { font-size: 12px; fill: #3d444d; }
    .heap  { fill: #ddf4ff; stroke: #0a4f9e; stroke-width: 2; }
    .res   { fill: #dafbe1; stroke: #0d4f21; stroke-width: 2; }
    .link  { stroke: #3d444d; stroke-width: 1.8; stroke-dasharray: 5 3; fill: none; }
    .size  { stroke: #9a1420; stroke-width: 1.4; }
  </style>

  <rect class="bg" width="720" height="360" rx="8"/>
  <text class="txt ttl" x="20" y="30">ディスクリプタヒープ（RTV 用・要素数 2）とバックバッファの対応</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d444d"/>
    </marker>
  </defs>

  <!-- ヒープ（連続した配列であることを、隙間なく並べて表現） -->
  <rect class="heap" x="40"  y="76" width="180" height="66" rx="3"/>
  <rect class="heap" x="220" y="76" width="180" height="66" rx="3"/>
  <text class="txt lbl" text-anchor="middle" x="130" y="104">[0] RTV</text>
  <text class="txt sub" text-anchor="middle" x="130" y="126">バッファ 0 の説明書</text>
  <text class="txt lbl" text-anchor="middle" x="310" y="104">[1] RTV</text>
  <text class="txt sub" text-anchor="middle" x="310" y="126">バッファ 1 の説明書</text>

  <!-- 「何を指しているか」を真下へまっすぐ結ぶ -->
  <line class="link" x1="130" y1="144" x2="130" y2="200" marker-end="url(#a2)"/>
  <line class="link" x1="310" y1="144" x2="310" y2="200" marker-end="url(#a2)"/>

  <!-- 実リソース -->
  <rect class="res" x="40"  y="206" width="180" height="60" rx="3"/>
  <rect class="res" x="220" y="206" width="180" height="60" rx="3"/>
  <text class="txt lbl" text-anchor="middle" x="130" y="232">バックバッファ 0</text>
  <text class="txt sub" text-anchor="middle" x="130" y="252">スワップチェーンが確保</text>
  <text class="txt lbl" text-anchor="middle" x="310" y="232">バックバッファ 1</text>
  <text class="txt sub" text-anchor="middle" x="310" y="252">スワップチェーンが確保</text>

  <!-- 先頭アドレスとディスクリプタサイズ -->
  <text class="txt sub" x="40" y="164">↑ GetCPUDescriptorHandleForHeapStart()</text>
  <line class="size" x1="40"  y1="60" x2="220" y2="60"/>
  <line class="size" x1="40"  y1="54" x2="40"  y2="66"/>
  <line class="size" x1="220" y1="54" x2="220" y2="66"/>
  <text class="txt sub" text-anchor="middle" x="130" y="48" fill="#9a1420">1 個ぶんのサイズ</text>

  <!-- 右側の注記 -->
  <rect x="430" y="76" width="260" height="86" rx="6" fill="#ffebe9" stroke="#9a1420" stroke-width="1.5"/>
  <text class="txt cap" x="446" y="100" fill="#9a1420">サイズはハードコード禁止</text>
  <text class="txt sub" x="446" y="122">1 個のバイト数は GPU の世代・ベンダー</text>
  <text class="txt sub" x="446" y="140">によって異なる（32 だったり 64 だったり）。</text>
  <text class="txt sub" x="446" y="156">GetDescriptorHandleIncrementSize() で取得。</text>

  <rect x="430" y="176" width="260" height="90" rx="6" fill="#fff8c5" stroke="#8a6d00" stroke-width="1.5"/>
  <text class="txt cap" x="446" y="200">N 番目の位置の求め方</text>
  <text class="txt sub" x="446" y="224">先頭アドレス + サイズ × N</text>
  <text class="txt sub" x="446" y="246">handle.ptr += m_rtvDescriptorSize * N;</text>
  <text class="txt sub" x="446" y="262">配列の添字計算と同じ考え方。</text>

  <text class="txt sub" x="40" y="296">ディスクリプタは「リソースそのもの」ではなく「リソースの説明書」。GPU はポインタではなくこの説明書を読む。</text>
  <text class="txt sub" x="40" y="316">ヒープは種類ごとに分ける決まりがあり、RTV 用ヒープに DSV や CBV を混ぜて置くことはできない。</text>
  <text class="txt sub" x="40" y="336">CPU ハンドルは「書き込むための住所」、GPU ハンドルは「GPU が読むための住所」で、同じ場所でも値は別。</text>
</svg>
