<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340"
     role="img" aria-label="タイムスタンプクエリの流れ。コマンドリストに時刻を打ち、Resolve でバッファへ移し、次に同じフレーム番号が回ってきたときに CPU が読む">
  <rect x="0" y="0" width="720" height="340" fill="#f6f8fa"/>

  <text x="24" y="34" font-family="Meiryo, sans-serif" font-size="17" fill="#1f2328">
    測った値が CPU に届くまで
  </text>

  <!-- 1 : 記録 -->
  <rect x="24" y="58" width="672" height="80" rx="6" fill="#ddf4ff" stroke="#0a4f9e"
        stroke-width="1"/>
  <text x="40" y="82" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">
    ① コマンドリストへ記録する（フレーム N）
  </text>

  <g font-family="Meiryo, sans-serif" font-size="12" fill="#1f2328">
    <rect x="48" y="94" width="118" height="30" rx="4" fill="#ffffff" stroke="#1f2328"
          stroke-width="1"/>
    <text x="107" y="113" text-anchor="middle">EndQuery（開始）</text>

    <rect x="182" y="94" width="118" height="30" rx="4" fill="#eaeef2" stroke="#1f2328"
          stroke-width="1"/>
    <text x="241" y="113" text-anchor="middle">描く</text>

    <rect x="316" y="94" width="118" height="30" rx="4" fill="#ffffff" stroke="#1f2328"
          stroke-width="1"/>
    <text x="375" y="113" text-anchor="middle">EndQuery（終了）</text>

    <rect x="470" y="94" width="200" height="30" rx="4" fill="#fff8c5" stroke="#1f2328"
          stroke-width="1"/>
    <text x="570" y="113" text-anchor="middle">ResolveQueryData</text>
  </g>

  <g stroke="#0a4f9e" stroke-width="1.5" fill="#0a4f9e">
    <line x1="166" y1="109" x2="176" y2="109"/><path d="M182 109 l-7 -4 l0 8 Z"/>
    <line x1="300" y1="109" x2="310" y2="109"/><path d="M316 109 l-7 -4 l0 8 Z"/>
    <line x1="434" y1="109" x2="464" y2="109"/><path d="M470 109 l-7 -4 l0 8 Z"/>
  </g>

  <!-- 2 : GPU が実行 -->
  <rect x="24" y="152" width="672" height="62" rx="6" fill="#eaeef2" stroke="#8c959f"
        stroke-width="1"/>
  <text x="40" y="176" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">
    ② GPU が実行し、読み出し用バッファ（READBACK）へ値が入る
  </text>
  <text x="40" y="198" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    いつ終わるかは CPU からは分からない。ここで読みにいくと、まだ書いている途中の値を読む。
  </text>

  <!-- 3 : 回収 -->
  <rect x="24" y="228" width="672" height="80" rx="6" fill="#dafbe1" stroke="#0d4f21"
        stroke-width="1"/>
  <text x="40" y="252" font-family="Meiryo, sans-serif" font-size="13" fill="#1f2328">
    ③ 次に同じフレーム番号が回ってきたとき（フレーム N + 2）に読む
  </text>
  <text x="40" y="274" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    そのフレーム番号のフェンスを待った直後なら、② は必ず終わっている。
  </text>
  <text x="40" y="294" font-family="Meiryo, sans-serif" font-size="12" fill="#3d444d">
    待つ処理を足す必要はない。もともと待っている場所を使うだけ。
  </text>
</svg>
