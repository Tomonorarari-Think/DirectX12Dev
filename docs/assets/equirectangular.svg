<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="正距円筒図法の対応。左は方向ベクトルと天頂角シータ・方位角ファイ、右は環境マップ画像で、横が方位角 u、縦が天頂角 v に対応する。v = 0 が真上、v = 1 が真下">
  <style>
    .bg   { fill: #f6f8fa; }
    .txt  { font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; }
    .ttl  { font-size: 16px; font-weight: 600; }
    .cap  { font-size: 14px; font-weight: 600; }
    .sub  { font-size: 12px; fill: #3d444d; }
    .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; fill: #1f2328; }
    .ball { fill: #eaeef2; stroke: #6e7781; stroke-width: 1.6; }
    .axis { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .dir  { stroke: #9a1420; stroke-width: 2.6; fill: none; }
    .the  { stroke: #0d4f21; stroke-width: 2.2; fill: none; }
    .phi  { stroke: #0a4f9e; stroke-width: 2.2; fill: none; }
    .img  { fill: #ffffff; stroke: #1f2328; stroke-width: 1.8; }
    .grid { stroke: #8c959f; stroke-width: 0.9; }
    .band { stroke: #6e7781; stroke-width: 1; }
    .link { stroke: #9a1420; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
  </style>

  <rect class="bg" width="860" height="470" rx="8"/>
  <text class="txt ttl" x="20" y="30">正距円筒図法 — 全方位を 1 枚の画像に畳む</text>
  <text class="txt sub" x="20" y="50">方向ベクトルの「見上げる角度」が縦、「まわりを向く角度」が横になる。左右の端はつながっている。</text>

  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a1420"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d4f21"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a4f9e"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <!-- ===== 左 : 方向ベクトル ===== -->
  <text class="txt cap" x="20" y="92">まわりを見わたす向き</text>

  <circle class="ball" cx="180" cy="250" r="118"/>
  <ellipse class="band" cx="180" cy="250" rx="118" ry="34" fill="none"/>

  <!-- 上下軸 -->
  <line class="axis" x1="180" y1="380" x2="180" y2="112" marker-end="url(#ak)"/>
  <text class="txt mono" x="188" y="122">+Y（真上）</text>
  <text class="txt mono" x="188" y="398">真下</text>

  <!-- 方向ベクトル -->
  <line class="dir" x1="180" y1="250" x2="286" y2="196" marker-end="url(#ad)"/>
  <text class="txt mono" x="292" y="192" fill="#9a1420">direction</text>

  <!-- シータ（天頂角）: +Y 軸から direction までの開き -->
  <path class="the" d="M 180 190 A 60 60 0 0 1 233.5 222.8" marker-end="url(#ag)"/>
  <text class="txt mono" x="206" y="206" fill="#0d4f21">θ</text>

  <!-- ファイ（方位角）: 水平面上の回り込み -->
  <path class="phi" d="M 298 250 A 118 34 0 0 1 239 279.4" marker-end="url(#ab)"/>
  <text class="txt mono" x="250" y="298" fill="#0a4f9e">φ</text>

  <text class="txt sub" x="20" y="418">θ（緑）… 真上からの角度。0（真上）から π（真下）まで。</text>
  <text class="txt sub" x="20" y="438">φ（青）… 水平方向の向き。ぐるりと一周する。</text>

  <!-- ===== 矢印 ===== -->
  <line class="link" x1="352" y1="250" x2="424" y2="250" marker-end="url(#ad)"/>
  <text class="txt mono" x="352" y="238" fill="#9a1420">u, v へ</text>

  <!-- ===== 右 : 画像 ===== -->
  <text class="txt cap" x="448" y="92">environment.png（512 x 256）</text>

  <rect class="img" x="448" y="112" width="384" height="192"/>

  <!-- 横グリッド（v） -->
  <line class="grid" x1="448" y1="160" x2="832" y2="160"/>
  <line class="grid" x1="448" y1="208" x2="832" y2="208"/>
  <line class="grid" x1="448" y1="256" x2="832" y2="256"/>
  <!-- 縦グリッド（u） -->
  <line class="grid" x1="544" y1="112" x2="544" y2="304"/>
  <line class="grid" x1="640" y1="112" x2="640" y2="304"/>
  <line class="grid" x1="736" y1="112" x2="736" y2="304"/>

  <!-- v 軸 -->
  <line class="axis" x1="436" y1="112" x2="436" y2="304"/>
  <text class="txt mono" x="392" y="118">v = 0</text>
  <text class="txt mono" x="392" y="212">v = 0.5</text>
  <text class="txt mono" x="392" y="308">v = 1</text>

  <!-- u 軸 -->
  <text class="txt mono" x="440" y="326">u = 0</text>
  <text class="txt mono" x="614" y="326">u = 0.5</text>
  <text class="txt mono" x="796" y="326">u = 1</text>

  <text class="txt sub" x="448" y="352">v = 0 が真上（+Y）、v = 1 が真下。u は水平方向の一周。</text>
  <text class="txt sub" x="448" y="372">左端と右端は同じ場所を指すので、横は繰り返し（WRAP）で読む。</text>

  <!-- 対応点 -->
  <circle cx="700" cy="160" r="5" fill="#9a1420"/>
  <text class="txt mono" x="576" y="150" fill="#9a1420">direction が指すテクセル</text>

  <!-- 極（上下の端の 1 行） -->
  <line x1="449" y1="115" x2="831" y2="115" stroke="#9a1420" stroke-width="4"/>
  <line x1="449" y1="301" x2="831" y2="301" stroke="#9a1420" stroke-width="4"/>

  <text class="txt sub" x="448" y="404" fill="#3d444d">赤い行は「真上・真下のたった 1 点」を横幅いっぱいに引き伸ばしたもの。</text>
  <text class="txt sub" x="448" y="424" fill="#3d444d">足し合わせるときは立体角の補正（sin θ）が要る。</text>
</svg>
